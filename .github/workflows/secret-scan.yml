name: Secret scan (public tree, self-check)

# Secret scan for the published tree. The job runs the shipped scanner
# tools/secret_scan.py over the repo root, with the shipped fixture allowlist
# tools/ce_preflight_fixture_allowlist.yaml. The allowlist exempts the CIDR
# range literals (192.168/16, 172.16/12) used by the docker-pool subnet test
# in CORE/Worker/internal/executor/stacksubnet_test.go.
#
# The job uses no repository secrets beyond the default GITHUB_TOKEN, and it
# runs with `permissions: contents: read`.
#
# Actions are pinned by major-version tag (actions/checkout@v4,
# actions/setup-python@v5).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  secret-scan-tree:
    name: secret_scan.py over the published tree (PyYAML for the allowlist, no baseline)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # The fixture allowlist is YAML, so the scanner needs PyYAML installed.
      - name: Install PyYAML (fixture allowlist prerequisite)
        run: python3 -m pip install "PyYAML==6.0.3"

      # Scan the repo root as the built tree. The forbidden-path, secret-pattern
      # and org-domain checks run here; the fixture allowlist applies to the
      # pattern checks. The reused-credential check is a no-op because
      # The local secrets list used in the private tree is not shipped.
      - name: Scan the tree (fixture allowlist, redacted findings only)
        run: |
          python3 tools/secret_scan.py \
            --tree . \
            --fixture-allowlist tools/ce_preflight_fixture_allowlist.yaml
