{{- if .Values.valkey.internal }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "mod.fullname" . }}-valkey
  labels:
    {{- include "mod.componentLabels" (dict "root" . "component" "valkey") | nindent 4 }}
spec:
  serviceName: {{ include "mod.fullname" . }}-valkey
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mod-valkey
      app.kubernetes.io/component: valkey
  template:
    metadata:
      labels:
        {{- include "mod.componentLabels" (dict "root" . "component" "valkey") | nindent 8 }}
    spec:
      {{- include "mod.imagePullSecrets" . | nindent 6 }}
      {{- $sched := include "mod.schedulerName" . }}
      {{- if $sched }}
      schedulerName: {{ $sched }}
      {{- end }}
      containers:
        - name: valkey
          image: {{ .Values.valkey.image }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - name: valkey
              containerPort: 6379
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.valkey.secret.name }}
                  key: REDIS_PASSWORD
          command:
            - sh
            - -c
            - exec valkey-server --requirepass "$REDIS_PASSWORD"
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - "valkey-cli -a \"$REDIS_PASSWORD\" ping | grep -q PONG"
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: {{ .Values.valkey.size }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "mod.fullname" . }}-valkey
  labels:
    {{- include "mod.componentLabels" (dict "root" . "component" "valkey") | nindent 4 }}
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: mod-valkey
    app.kubernetes.io/component: valkey
  ports:
    - name: valkey
      port: 6379
      targetPort: valkey
{{- end }}
