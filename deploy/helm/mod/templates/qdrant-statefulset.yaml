{{- if .Values.qdrant.internal }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "mod.fullname" . }}-qdrant
  labels:
    {{- include "mod.componentLabels" (dict "root" . "component" "qdrant") | nindent 4 }}
spec:
  serviceName: {{ include "mod.fullname" . }}-qdrant
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mod-qdrant
      app.kubernetes.io/component: qdrant
  template:
    metadata:
      labels:
        {{- include "mod.componentLabels" (dict "root" . "component" "qdrant") | nindent 8 }}
    spec:
      {{- include "mod.imagePullSecrets" . | nindent 6 }}
      {{- $sched := include "mod.schedulerName" . }}
      {{- if $sched }}
      schedulerName: {{ $sched }}
      {{- end }}
      containers:
        - name: qdrant
          image: {{ .Values.qdrant.image }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: 6333
            - name: grpc
              containerPort: 6334
          env:
            - name: QDRANT__SERVICE__GRPC_PORT
              value: "6334"
            # Fail closed: API key required (compose qdrant-hardening).
            - name: QDRANT__SERVICE__API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.qdrant.secret.name }}
                  key: QDRANT_API_KEY
          volumeMounts:
            - name: data
              mountPath: /qdrant/storage
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              memory: {{ .Values.qdrant.memLimit }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: {{ .Values.qdrant.size }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "mod.fullname" . }}-qdrant
  labels:
    {{- include "mod.componentLabels" (dict "root" . "component" "qdrant") | nindent 4 }}
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: mod-qdrant
    app.kubernetes.io/component: qdrant
  ports:
    - name: http
      port: 6333
      targetPort: http
    - name: grpc
      port: 6334
      targetPort: grpc
{{- end }}
