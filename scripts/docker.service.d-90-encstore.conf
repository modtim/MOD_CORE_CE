# 90-encstore.conf - drop-in for docker.service: dockerd must wait for the
# encrypted-store key restore (mod-ce-encstore.service) before it restores the
# `unless-stopped` containers. Without this, dockerd re-creates my_redis / my_versitygw
# at boot while /run/secrets/gocryptfs-pass is still a tmpfs DIRECTORY, the bind fails
# ("not a directory: Are you trying to mount a directory onto a file") and both stores
# come back Exited (127) - never retried by the restart policy.
#
# Install (idempotent; scripts/install.sh does this when systemctl exists):
#   sudo install -m 644 docker.service.d-90-encstore.conf /etc/systemd/system/docker.service.d/90-encstore.conf
#   sudo systemctl daemon-reload
# Check:  systemctl cat docker.service | grep -A2 90-encstore
#         systemctl list-units --type=service --after=mod-ce-encstore.service
#
# This file is a systemd unit drop-in, NOT compose YAML. It changes nothing about
# Docker's own start; it only orders it. If mod-ce-encstore.service is not installed,
# remove this drop-in (systemctl start docker still works: a missing Requires= target
# makes systemd refuse the start, so the pair is installed together by install.sh).
[Unit]
After=mod-ce-encstore.service
Requires=mod-ce-encstore.service
