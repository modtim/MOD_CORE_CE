# Each entry needs a reason; do NOT add a real secret's path here as a
# shortcut past the gate.
#
# Format:
#   - path: <glob path under scanned tree>       # required: match relpath
#     pattern_only: <substring>                   # optional: also require this substring
#     reason: <one-line explanation>
#
# Only SECRET_PATTERNS matches can be allow-listed.  FORBIDDEN_PATH,
# reused-secret, and org-domain (outside governance docs) checks are
# NOT allow-listable.
#
# Review note (1641 review pass): this file originally listed 40 entries,
# but 36 of them named paths the CE build can never actually produce —
# CORE/API/tests/** and CORE/LicenseServer/** are denied wholesale,
# CORE/Marketplace/** and the repo-root docs/ and CORE/docs/ trees match no
# `allow` rule at all (manifest.yaml is deny-by-default), and open-core/
# itself is hard-excluded from the walk in build_public_repo.py's own
# `skip_dirs`. None of those paths can ever reach a built CE tree, so an
# allowlist entry for them can never fire and is dead weight (and signals
# the entries were written speculatively rather than from a real
# `secret_scan.py` run against a fresh `build_public_repo.py` output, which
# the brief required). Pruned down to the entries that name a path that
# actually ships.

