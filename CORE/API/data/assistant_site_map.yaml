# MOD Assistant — site map
#
# Single source of truth for every page, dialog, tab, and anchor the
# in-product chat agent can ground a navigation action against. Edit
# this file like a normal source file; CI rejects PRs that add new
# Dashboard / WorkflowBuilder routes without a matching entry here
# (see CORE/API/utils/assistant_site_map.py for the validator and
# the §2.5 CI hook).
#
# Schema (per mod-assistant-agent / specs / mod-assistant-site-map):
#   pages:
#     - display_name: "<user-facing name>"   # what the assistant calls it in chat
#       url: "<relative route>"              # actual route; relative within `app`
#       app: dashboard | workflow_builder    # which app hosts the page
#       summary: "<one sentence>"            # what the page does (model context)
#       dialogs:                             # optional, dialogs reachable on this page
#         - id: "<stable dialog id>"
#           display_name: "<name>"
#       tabs:                                # optional, tabs inside this page
#         - label: "<stable label>"
#           display_name: "<name>"
#       anchors:                             # optional, scroll-to / highlight targets
#         - "<css selector>"
#
# Only add an entry once the surface actually exists in code — the
# startup validator cross-checks Dashboard /pages/*.html and the
# Next.js app router. A YAML entry pointing at a missing route
# crashes API startup with a clear diagnostic.

pages:
  # ----- Dashboard: tenant-user surfaces -----

  - display_name: "Home"
    url: "/#home"
    app: dashboard
    summary: "Dashboard landing page with overview cards and recent activity."

  - display_name: "Billing"
    url: "/#billing"
    app: dashboard
    summary: "Manage your account balance and credit usage."
    dialogs:
      - id: top-up-balance
        display_name: "Top up balance"
      - id: switch-plan
        display_name: "Review your settings"
    anchors:
      - "#balance-card"
      - "#current-plan-card"
      - "#payment-method-card"

  - display_name: "Account details"
    url: "/#subscription"
    app: dashboard
    summary: "View and change your account settings."

  - display_name: "Feature overview"
