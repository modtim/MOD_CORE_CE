[pytest]
testpaths = tests
markers =
    payments: full payments/Stripe coverage slice (item #7).
        Subscription lifecycle, invoice / dunning, webhook handler,
        custom plans, payments admin console. CI runs this slice
        as a dedicated job so the launch billing stack is gated
        independently of the broader test suite.
    psr_cache: opt OUT of conftest's autouse platform-settings cache purge.
        Only for tests that deliberately exercise the in-process TTL cache in
        services/platform_settings (assert a stale entry is served, count
        queries, or inspect _cache).
    real_heartbeat_rate_limit: opt OUT of conftest's autouse heartbeat rate-limit relaxation.
        Only for a test that must exercise the real worker-heartbeat limiter
        (key prefix "heartbeat:", routers/worker_management.py). None needs it today.
filterwarnings =
    ignore::DeprecationWarning:pydantic.*
    ignore::DeprecationWarning:fastapi.*
    ignore::sqlalchemy.exc.SAWarning
    ignore::sqlalchemy.exc.LegacyAPIWarning
    ignore:datetime.datetime.utcnow:DeprecationWarning
    ignore::ResourceWarning
    ignore::pytest.PytestUnraisableExceptionWarning
