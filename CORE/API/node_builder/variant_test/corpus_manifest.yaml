# GO.5 — golden corpus manifest for accelerator-variant verification.
#
# 28 spec entries (go-3-corpus-spec-DRAFT.md, spec entries 01-28 MINUS 06 and
# 22, which are `pending-registration` per LEAD DECISIONS 2026-09-29 item 1)
# PLUS one synthetic embedding node (LEAD DECISIONS item 3).
#
# Per entry:
#   id          — stable corpus id (spec number, or `syn-embedding`).
#   node_kind   — registered node_kind for real nodes, `synthetic:<name>` for
#                 the synthetic list (JAX / TensorRT / ORT-EP / broken-NVENC /
#                 embedding). Synthetic nodes have no NodeDefinition row yet;
#                 the harness dispatch layer must seed their build source
#                 before a live run (see corpus_harness._dispatch).
#   class       — spec coverage class.
#   origin      — origin accelerator (cuda / rocm / cpu). `none` = the node is
#                 already multi-built and has no single origin.
#   fixture     — fixed input, "<catalogue type>/<filename>" into
#                 tests/fixtures/node_catalogue/manifest.json (null = node
#                 takes no input, e.g. the accelerator benchmark).
#   expected    — expected verdict per accelerator: pass | pass-tol |
#                 incompat | spec | na. Step 0 of the harness re-labels `spec`
#                 cells to `unknown-hw` where the probed hardware lacks the
#                 facts needed to confirm the verdict — no guessing.
#   comparer    — output_type handed to variant_test.comparer.
#
# Roam note: the spec's rocm-1201 / rocm-1151 columns are collapsed to a
# single `rocm` accelerator for the harness (the fleet exposes one `rocm`
# variant key). LEAD DECISIONS items 4/5 keep their verdicts `spec`, so the
# probe decides.

entries:
  - id: "01"
    node_kind: depth_anything_process
    class: pure_pytorch
    origin: cuda
    fixture: image/image_red_circle.png
    expected: {cuda: pass, rocm: pass-tol, intel: pass-tol, npu: spec, cpu: pass-tol}
    comparer: image
  - id: "02"
