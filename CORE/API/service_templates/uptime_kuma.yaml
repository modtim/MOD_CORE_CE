# GA.ASW.2b — service template catalog (uptime_kuma)
# Pinned image, declared backup posture. GA.ASW.2b: dropped the
# `x-mod.secrets: vault:platform/...` block — nothing ever wrote that Vault
# entry (_resolve_stack_secrets fails closed on a missing ref, 502), the path
# wasn't under the per-stack tenant prefix _validate_compose requires, AND
# louislam/uptime-kuma has no admin-password env var at all — the first user
# to open the web UI is walked through creating the admin account. So this
# template sets no credential env; see services/service_templates.py for the
# loader and the {key} substitution contract. The image is pinned to a
# specific version tag (never :latest).
id: uptime_kuma
name: Uptime Kuma
description: A self-hosted uptime/monitoring tool with a managed data volume.
storage_class: local_fs
# GA.ASW.2 — backup posture. Uptime Kuma's monitor config/state lives on the
# data volume, so the substrate volume snapshot (raw_volume) is the right
# posture.
backup: raw_volume
params: []
compose:
  services:
    uptime_kuma:
      image: "louislam/uptime-kuma:1.23.13"
      volumes:
        - "data:/app/data"
  volumes:
    data: {}
