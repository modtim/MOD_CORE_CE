<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audit Logs</title>
    <link href="/tailwind.css" rel="stylesheet">
    <!-- GY.C0 — declared compliance environment admin banner (hook; full
         Compliance page lands in a later GY.C0 slice) -->
    <script src="/js/config.js"></script>
</head>
<body class="bg-gray-50">
    <div id="audit-logs-container" class="max-w-7xl mx-auto p-6">
        <!-- Header -->
        <div class="mb-6">
            <h1 class="text-3xl font-bold text-gray-900" data-theme-key="audit-logs">Permission Audit Logs</h1>
            <p class="text-gray-600 mt-2">Track all permission-related changes for compliance and debugging</p>
            <!-- FX.160 p5c (owner R36.5=A) — Runbook link (href filled by js/runbook-links.js). -->
            <p class="mt-2"><a id="rb-audit-logs" href="#" target="_blank" rel="noopener" class="text-sm text-gray-500 hover:text-gray-700 underline">Runbook: the SIEM event schema these rows map to</a></p>
        </div>

        <!-- GY.C0 — declared compliance environment admin banner hook
             (rendered by js/compliance-env-banner.js; empty for non-admins) -->
        <div id="compliance-env-banner"></div>

        <!-- 402 gate notice (hidden by default) -->
        <div id="audit-plan-gate" class="hidden bg-amber-50 border border-amber-200 rounded-lg p-6 mb-6">
            <div class="flex items-start gap-3" role="status">
                <svg class="w-5 h-5 text-amber-500 mt-0.5 flex-shrink-0" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M8.257 3.099c.765-1.36 2.722-1.36 3.486 0l5.58 9.92c.75 1.334-.213 2.98-1.742 2.98H4.42c-1.53 0-2.493-1.646-1.743-2.98l5.58-9.92zM11 13a1 1 0 11-2 0 1 1 0 012 0zm-1-8a1 1 0 00-1 1v3a1 1 0 002 0V6a1 1 0 00-1-1z" clip-rule="evenodd"/></svg>
                <div>
                    <h3 class="text-sm font-medium text-amber-800">Tamper-Evident Audit Trail</h3>
                    <p id="audit-plan-gate-message" class="mt-1 text-sm text-amber-700"></p>
                </div>
            </div>
        </div>

        <!-- Filters -->
        <div class="bg-white rounded-lg shadow-sm p-6 mb-6">
            <h2 class="text-lg font-semibold mb-4">Filters</h2>
            <!-- BUG.B30b — free-text search (server-side `q` on /audit-logs/permissions:
                 matches action, resource type, actor/target email). Full width, above the
                 selects, so it is the first thing the eye lands on. -->
            <input aria-label="Search audit logs" id="filter-search" type="search" placeholder="Search action, resource or user email…" class="w-full border border-gray-300 rounded-lg px-3 py-2" />
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Action Type</label>
                    <select aria-label="Action Type" id="filter-action" class="w-full border border-gray-300 rounded-lg px-3 py-2">
                        <option value="">All Actions</option>
                        <option value="permission_granted">Permission Granted</option>
                        <option value="permission_revoked">Permission Revoked</option>
                        <option value="permission_updated">Permission Updated</option>
                        <option value="permission_requested">Permission Requested</option>
                        <option value="permission_request_approved">Request Approved</option>
                        <option value="permission_request_denied">Request Denied</option>
                        <option value="permission_request_cancelled">Request Cancelled</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Resource Type</label>
                    <select aria-label="Resource Type" id="filter-resource-type" class="w-full border border-gray-300 rounded-lg px-3 py-2">
                        <option value="">All Resources</option>
                        <option value="cog">Folders</option>
                        <option value="workflow" data-theme-key="workflows">Workflows</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Date Range</label>
                    <select aria-label="Date Range" id="filter-date-range" class="w-full border border-gray-300 rounded-lg px-3 py-2">
                        <option value="7">Last 7 Days</option>
                        <option value="30">Last 30 Days</option>
                        <option value="90">Last 90 Days</option>
                        <option value="all">All Time</option>
                    </select>
                </div>
            </div>
            <div class="mt-4 flex gap-3">
                <button id="apply-filters" class="bg-primary hover:bg-primary/90 text-white px-4 py-2 rounded-lg">
                    Apply Filters
                </button>
                <button id="reset-filters" class="bg-gray-200 hover:bg-gray-300 text-gray-700 px-4 py-2 rounded-lg">
                    Reset
                </button>
            </div>
            <!-- BUG.B29c Part C — audit export ported from the old Logs-page Audit
                 tab (#13): permission_audit_logs + audit_events. New ids so the two
                 pages never clash while both exist. -->
            <div class="mt-3 flex flex-wrap items-center justify-end gap-2">
                <span id="audit-page-export-status" class="text-xs text-gray-500 mr-auto"></span>
                <button id="audit-page-download-csv" class="inline-flex items-center gap-1.5 bg-white border border-gray-300 hover:bg-gray-50 text-gray-700 px-3 py-2 rounded-lg text-sm">
                    <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                    Download CSV
                </button>
                <button id="audit-page-download-json" class="inline-flex items-center gap-1.5 bg-white border border-gray-300 hover:bg-gray-50 text-gray-700 px-3 py-2 rounded-lg text-sm">
                    <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                    Download JSON
                </button>
            </div>
        </div>

        <!-- Audit Logs Table -->
        <div class="bg-white rounded-lg shadow-sm overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full divide-y divide-gray-200">
                    <thead class="bg-gray-50">
                        <tr>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                                Timestamp
                            </th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                                Action
                            </th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                                Actor
                            </th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                                Target User
                            </th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                                Resource
                            </th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                                Level
                            </th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                                Details
                            </th>
                        </tr>
                    </thead>
                    <tbody id="logs-tbody" class="bg-white divide-y divide-gray-200">
                        <!-- Logs will be inserted here -->
                    </tbody>
                </table>
            </div>

            <!-- Loading State -->
            <div id="loading-state" class="p-8 text-center hidden">
                <div class="inline-block h-8 w-8 animate-spin rounded-full border-4 border-solid border-primary border-r-transparent"></div>
                <p class="mt-2 text-gray-600">Loading audit logs...</p>
            </div>

            <!-- Empty State -->
            <div id="empty-state" class="p-8 text-center hidden">
                <p class="text-gray-600">No audit logs found</p>
            </div>
        </div>

        <!-- Pagination -->
        <div class="mt-6 flex justify-between items-center">
            <div class="text-sm text-gray-600">
                <span id="results-info"></span>
            </div>
            <div class="flex gap-2">
                <button id="prev-page" class="bg-white border border-gray-300 text-gray-700 px-4 py-2 rounded-lg hover:bg-gray-50 disabled:opacity-50 disabled:cursor-not-allowed" disabled>
                    Previous
                </button>
                <button id="next-page" class="bg-white border border-gray-300 text-gray-700 px-4 py-2 rounded-lg hover:bg-gray-50 disabled:opacity-50 disabled:cursor-not-allowed">
                    Next
                </button>
            </div>
        </div>

        <!-- Log Detail Modal -->
        <div id="log-detail-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50">
            <div class="bg-white rounded-lg max-w-2xl w-full max-h-[90vh] overflow-y-auto">
                <div class="p-6">
                    <div class="flex justify-between items-start mb-4">
                        <h2 class="text-2xl font-bold text-gray-900">Audit Log Details</h2>
                        <button id="close-detail-modal" class="text-gray-400 hover:text-gray-600" aria-label="Close">
                            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                            </svg>
                        </button>
                    </div>

                    <div id="log-detail-content" class="space-y-4">
                        <!-- Details will be inserted here -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeAuditLogsPage } from '/js/audit-logs.js';
        if (document.getElementById('audit-logs-container')) initializeAuditLogsPage();
    </script>
</html>
