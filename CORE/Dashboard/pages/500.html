<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Something Went Wrong - MOD Platform</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f8fafc; display: flex; align-items: center; justify-content: center; min-height: 100vh; color: #334155; }
        .container { text-align: center; max-width: 480px; padding: 40px 20px; }
        .code { font-size: 96px; font-weight: 800; color: #dc2626; line-height: 1; }
        h1 { font-size: 24px; margin: 16px 0 8px; color: #1e293b; }
        p { color: #64748b; margin-bottom: 24px; line-height: 1.6; }
        .actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
        a, button { display: inline-block; padding: 10px 24px; border-radius: 8px; text-decoration: none; font-weight: 500; font-size: 14px; transition: all 0.2s; cursor: pointer; border: none; }
        .primary { background: #4f46e5; color: white; }
        .primary:hover { background: #4338ca; }
        .secondary { background: white; color: #4f46e5; border: 1px solid #e2e8f0; }
        .secondary:hover { border-color: #4f46e5; }
    </style>
</head>
<body>
    <div class="container">
        <div class="code">500</div>
        <h1>Something went wrong</h1>
        <p>We're having trouble processing your request. This is usually temporary. Try refreshing or come back in a few minutes.</p>
        <div class="actions">
            <button id="retry-btn" class="primary">Try Again</button>
            <a href="/" class="secondary">Go to Dashboard</a>
        </div>
    </div>
<script src="/js/error-pages.js"></script>
</body>
</html>
