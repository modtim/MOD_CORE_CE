# Simple Nginx configuration for a Single-Page Application (SPA)

events {}

http {
  include /etc/nginx/mime.types;

  server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # mod-docs is optional (a CE service, published on 3002).  Use Docker
    # embedded DNS so the upstream is resolved per-request rather
    # than at nginx startup — preventing the container from dying
    # when mod-docs is not on the network.
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $mod_docs_upstream http://mod-docs;

    # S19: Security headers (CSP-1 phase 1: the same five headers now live in
    # a shared snippet, CORE/Dashboard/security-headers.conf, because nginx
    # DROPS server-level add_header in any location block that defines its own
    # add_header — every location below that sets Cache-Control re-includes it.
    # /embed/run.html is the one location that deliberately does not: framing
    # there is governed by the API's per-link frame-ancestors allowlist.)
    include /etc/nginx/security-headers.conf;

    # help-mind-map §3 — same-origin proxy to mod-docs's
    # auto-generated help tree. Putting the asset on the dashboard
    # origin sidesteps CORS entirely (the Mind Map fetcher reads
    # `/help-tree.json` instead of `${DOCS_URL}/help-tree.json`)
    # and is necessary in the Playwright fixture's local-stack
    # config where DOCS_URL points at the dashboard origin. The
    # mod-docs service exposes this as a 5-minute-cached public
    # static asset (no auth, no tenant data).
    location = /help-tree.json {
        include /etc/nginx/security-headers.conf;
        proxy_pass $mod_docs_upstream/help-tree.json;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=300" always;
    }

    # RFC 9116 machine-readable security contact. The file lives on the
    # mod-docs service (docs-site static/.well-known/security.txt); proxy it
    # so the dashboard host serves it too instead of falling back to the
    # SPA index.html.
    location = /.well-known/security.txt {
        include /etc/nginx/security-headers.conf;
        proxy_pass $mod_docs_upstream/.well-known/security.txt;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=300" always;
    }

    # Serve a real favicon for bare /favicon.ico requests (bookmarks, and
    # browsers that fetch it regardless of <link rel=icon>). Without an
    # explicit rule this 404s at the root — the branding icon is an SVG, so
    # set the type explicitly since the request URI ends in .ico.
    location = /favicon.ico {
        include /etc/nginx/security-headers.conf;
        alias /usr/share/nginx/html/branding/favicons/icon.svg;
        # The URI ends in .ico so nginx's mime map would label it
        # image/x-icon; clear the map for this location so default_type
        # (the real SVG type) wins and browsers render it.
        types { }
        default_type image/svg+xml;
        add_header Cache-Control "public, max-age=86400";
    }

    # Static pages under /pages/: a missing file is a real 404, never the SPA shell.
    # DASH-71: these are HTML fragments (no <meta charset>) with non-ASCII headings
    # (em-dashes), so without a charset the browser sniffs the wrong codepage and
    # misdecodes them. Scope kept to /pages/ only: the SPA, js/css and API
    # responses are untouched (nginx's default charset_types already covers
    # text/html, so no charset_types line is needed).
    location /pages/ {
        try_files $uri =404;
        charset utf-8;
        # NIT-DASH-500 (audit F2): a missing static page under /pages/ renders the
        # designed 404 page instead of nginx's stock text/plain body. Scoped to
        # THIS location only (never server-wide): the SPA fallback at `location /`
        # must keep serving index.html for unknown client routes. The target
        # exists (pages/404.html is copied wholesale by the Dockerfile), so the
        # internal redirect cannot loop.
        error_page 404 /pages/404.html;
    }

    # Fallback for SPAs: try to serve the file, otherwise serve index.html
    location / {
      include /etc/nginx/security-headers.conf;
      add_header Cache-Control "no-cache, no-store, must-revalidate";
      try_files $uri $uri/ /index.html;
    }

    # --- NEW ---
    # Ensure the new invitation page is served directly
    location = /accept-invitation.html {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    # external-invite-accept-ui — public accept page for external folder
    # invitations. Token-authed (the ?token= is the credential), no login, so
    # it must NOT fall back to the SPA index.html (which would show the login
    # gate). Both the clean URL (/accept-invite, used in the copyable link)
    # and the raw file path resolve to the same page.
    location = /accept-invite {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files /accept-external-invite.html =404;
    }
    location = /accept-external-invite.html {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    # Public "share as app" embed surface. Token-authed, no login — it must
    # NOT fall back to the SPA index.html, or an embed viewer gets the
    # "Checking authentication…" login gate instead of the run page. Serve
    # the file directly; a genuinely missing file returns 404 (clear) rather
    # than silently masquerading as the login SPA.
    location = /embed/run.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    # Tray app download page
    location = /downloads.html {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    # Tray app installers and manifest
    location /downloads/ {
        include /etc/nginx/security-headers.conf;
        alias /usr/share/nginx/html/downloads/;
        autoindex off;
        add_header Cache-Control "public, max-age=3600";
    }

    location ~ \.js$ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # nginx's bundled mime.types has no .mjs entry (only .js), so ES
    # module files served with that extension — vendored pdf.js's
    # pdf.min.mjs / pdf.worker.min.mjs (see /vendor/pdfjs-dist@4.7.76)
    # — would fall back to default_type (text/plain) and be refused by
    # the browser's module loader. Force the correct JS MIME type here.
    location ~* \.mjs$ {
        include /etc/nginx/security-headers.conf;
        default_type application/javascript;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ~* \.(css|png|jpg|jpeg|gif|ico|svg|woff2|woff|ttf|eot|wasm)$ {
      include /etc/nginx/security-headers.conf;
      expires 1y;
      add_header Cache-Control "public, immutable";
    }
  }
}