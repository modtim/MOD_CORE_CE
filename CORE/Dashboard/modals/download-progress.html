<div id="download-progress-modal" class="fixed inset-0 bg-gray-600 bg-opacity-50 overflow-y-auto h-full w-full z-50">
    <div class="relative top-20 mx-auto p-5 border w-96 shadow-lg rounded-md bg-white">
        <div class="flex justify-between items-center pb-3 border-b">
            <h3 class="text-lg font-semibold text-gray-900">Preparing Download</h3>
            <button id="minimize-download-button" class="text-gray-400 hover:text-gray-600 text-sm">
                Minimize
            </button>
        </div>

        <div class="mt-4">
            <!-- Status message -->
            <div id="download-status" class="text-sm text-gray-600 mb-2">
                Initializing...
            </div>

            <!-- Progress bar -->
            <div class="w-full bg-gray-200 rounded-full h-4 mb-2">
                <div id="download-progress-bar" class="bg-primary h-4 rounded-full transition-all duration-300" style="width: 0%"></div>
            </div>

            <!-- Progress text -->
            <div id="download-progress-text" class="text-xs text-gray-500 text-center">
                0%
            </div>

            <!-- Current file -->
            <div id="download-current-file" class="text-xs text-gray-400 mt-2 truncate" title="">
            </div>
        </div>

        <!-- Error message (hidden by default) -->
        <div id="download-error" class="mt-4 p-3 bg-red-50 border border-red-200 rounded-md hidden">
            <p class="text-sm text-red-700" id="download-error-message"></p>
        </div>

        <!-- Success message (hidden by default) -->
        <div id="download-success" class="mt-4 p-3 bg-green-50 border border-green-200 rounded-md hidden">
            <p class="text-sm text-green-700">Download ready! Your file should start downloading automatically.</p>
        </div>

        <div class="mt-6 flex justify-end">
            <button type="button" id="close-download-button" class="bg-gray-300 text-gray-700 px-4 py-2 rounded-md hidden">
                Close
            </button>
            <button type="button" id="cancel-download-button" class="bg-red-600 text-white px-4 py-2 rounded-md">
                Cancel
            </button>
        </div>
    </div>
</div>
