<div id="alert-action-modal" class="fixed inset-0 bg-gray-600 bg-opacity-50 overflow-y-auto h-full w-full z-50">
    <div class="relative top-20 mx-auto p-5 border w-96 shadow-lg rounded-md bg-white">
        <h3 id="alert-action-title" class="text-lg font-medium text-gray-900">Notice</h3>
        <p id="alert-action-message" class="text-sm text-gray-500 mt-1 whitespace-pre-wrap break-words select-text"></p>
        <div class="mt-6 flex justify-end">
            <button id="alert-action-ok" type="button" class="bg-primary text-white px-4 py-2 rounded-md">OK</button>
            <button id="alert-action-action" type="button" class="bg-primary text-white px-4 py-2 rounded-md ml-2" hidden>Action</button>
        </div>
    </div>
</div>
