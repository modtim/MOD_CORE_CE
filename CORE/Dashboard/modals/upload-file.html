<div id="upload-file-modal" class="fixed inset-0 bg-gray-600 bg-opacity-50 overflow-y-auto h-full w-full z-50">
    <div class="relative top-20 mx-auto p-5 border w-96 shadow-lg rounded-md bg-white">
        <h3 class="text-lg font-medium text-gray-900">Upload File</h3>
        <form id="upload-file-form" class="mt-4">
            <div>
                <label for="file-input" class="block text-sm font-medium text-gray-700">Select File(s)</label>
                <input type="file" id="file-input" class="mt-1 block w-full" multiple required>
            </div>
            <div class="mt-4">
                <progress id="upload-progress" value="0" max="100" class="w-full"></progress>
            </div>
            <div class="mt-6 flex justify-end">
                <button type="button" id="cancel-upload-button" class="bg-gray-300 text-gray-700 px-4 py-2 rounded-md mr-2">Cancel</button>
                <button type="submit" id="upload-submit-button" class="bg-green-600 text-white px-4 py-2 rounded-md">Upload</button>
            </div>
        </form>
    </div>
</div>
