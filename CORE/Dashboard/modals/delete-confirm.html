<div id="delete-confirm-modal" class="fixed inset-0 bg-gray-600 bg-opacity-50 overflow-y-auto h-full w-full z-50">
    <div class="relative top-20 mx-auto p-5 border w-96 shadow-lg rounded-md bg-white">
        <h3 class="text-lg font-medium text-gray-900">Confirm Deletion</h3>
        <p id="delete-confirm-message" class="mt-2 text-sm text-gray-600">Are you sure you want to delete this item? This action cannot be undone.</p>
        <div class="mt-6 flex justify-end">
            <button type="button" id="cancel-delete-button" class="bg-gray-300 text-gray-700 px-4 py-2 rounded-md mr-2">Cancel</button>
            <button type="button" id="confirm-delete-button" class="bg-red-600 text-white px-4 py-2 rounded-md">Delete</button>
        </div>
    </div>
</div>
