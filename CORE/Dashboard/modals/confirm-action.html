<div id="confirm-action-modal" class="fixed inset-0 bg-gray-600 bg-opacity-50 overflow-y-auto h-full w-full z-50">
    <div class="relative top-20 mx-auto p-5 border w-96 shadow-lg rounded-md bg-white">
        <div class="flex items-start gap-3">
            <div class="flex-shrink-0 mt-0.5">
                <svg class="h-6 w-6 text-amber-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.228 9c.549-1.165 2.03-2 3.772-2 2.21 0 4 1.343 4 3 0 1.4-1.278 2.575-3.006 2.907-.542.104-.994.54-.994 1.093m0 3h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
            </div>
            <div class="flex-1 min-w-0">
                <h3 id="confirm-action-title" class="text-lg font-medium text-gray-900">Confirm</h3>
                <p id="confirm-action-message" class="text-sm text-gray-600 mt-1 whitespace-pre-wrap break-words"></p>
            </div>
        </div>
        <div class="mt-6 flex justify-end gap-2">
            <button id="confirm-action-cancel" type="button" class="bg-gray-100 text-gray-700 px-4 py-2 rounded-md hover:bg-gray-200 transition-colors">
                Cancel
            </button>
            <button id="confirm-action-ok" type="button" class="bg-primary text-white px-4 py-2 rounded-md hover:bg-primary/90 transition-colors">
                OK
            </button>
        </div>
    </div>
</div>
