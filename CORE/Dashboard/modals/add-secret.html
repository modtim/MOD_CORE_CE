<div id="add-secret-modal" class="fixed inset-0 bg-gray-600 bg-opacity-50 overflow-y-auto h-full w-full z-50">
    <div class="relative top-20 mx-auto p-5 border w-96 shadow-lg rounded-md bg-white">
        <h3 class="text-lg font-medium text-gray-900">Add New Secret</h3>
        <p class="text-sm text-gray-500 mt-1">Secrets are encrypted and cannot be viewed after creation.</p>
        <form id="add-secret-form" class="mt-4">
            <div>
                <label for="secret-name" class="block text-sm font-medium text-gray-700">Name</label>
                <input type="text" id="secret-name" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm" required>
            </div>
            <div class="mt-4">
                <label for="secret-value" class="block text-sm font-medium text-gray-700">Value</label>
                <div class="relative mt-1">
                    <input type="password" id="secret-value" class="block w-full px-3 py-2 pr-10 border border-gray-300 rounded-md shadow-sm" required>
                    <button type="button" id="toggle-secret-visibility" class="absolute top-0 bottom-0 right-0 pr-3 flex items-center cursor-pointer" tabindex="-1">
                        <svg id="eye-icon" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-gray-400 hover:text-gray-600 cursor-pointer" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                        </svg>
                        <svg id="eye-off-icon" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-gray-400 hover:text-gray-600 cursor-pointer hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21" />
                        </svg>
                    </button>
                </div>
            </div>
            <div class="mt-4">
                <label for="secret-description" class="block text-sm font-medium text-gray-700">Description (Optional)</label>
                <textarea id="secret-description" rows="3" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm"></textarea>
            </div>
            <div class="mt-6 flex justify-end">
                <button type="button" id="cancel-secret-button" class="bg-gray-300 text-gray-700 px-4 py-2 rounded-md mr-2">Cancel</button>
                <button type="submit" class="bg-primary text-white px-4 py-2 rounded-md">Save Secret</button>
            </div>
        </form>
    </div>
</div>
