<div id="make-folder-modal" class="fixed inset-0 bg-gray-600 bg-opacity-50 overflow-y-auto h-full w-full z-50">
    <div class="relative top-20 mx-auto p-5 border w-96 shadow-lg rounded-md bg-white">
        <h3 class="text-lg font-medium text-gray-900">Create New Folder</h3>
        <form id="make-folder-form" class="mt-4">
            <div>
                <label for="folder-name" class="block text-sm font-medium text-gray-700">Folder Name</label>
                <input type="text" id="folder-name" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm" required>
            </div>
            <div class="mt-6 flex justify-end">
                <button type="button" id="cancel-folder-button" class="bg-gray-300 text-gray-700 px-4 py-2 rounded-md mr-2">Cancel</button>
                <button type="submit" class="bg-primary text-white px-4 py-2 rounded-md">Create</button>
            </div>
        </form>
    </div>
</div>
