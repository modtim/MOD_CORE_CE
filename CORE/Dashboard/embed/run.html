<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<!-- SECURITY: the run-link token rides this page's URL query string. Suppress
     the Referer header so that token can never leak to a third-party origin
     via a cross-origin subresource request or an outbound navigation. -->
<meta name="referrer" content="strict-origin-when-cross-origin" />
<title>Run</title>
<!-- Explicit icon so the browser doesn't fall back to GET /favicon.ico (which
     404s at the dashboard root). Absolute paths — this page is served under
     /embed/, so a relative href would resolve wrong. Mirrors index.html. -->
<link rel="icon" type="image/svg+xml" href="/branding/favicons/icon.svg" media="(prefers-color-scheme: light)" />
<link rel="icon" type="image/svg+xml" href="/branding/favicons/icon-dark.svg" media="(prefers-color-scheme: dark)" />
<link rel="icon" type="image/svg+xml" href="/branding/favicons/icon.svg" />
<style>
  /* Light (default). */
  :root {
    --primary:#0333d0; --accent:#05A1ff;
    --bg:#f6f9fc; --card:#ffffff; --line:#e5e7eb; --muted:#6b7280; --fg:#1a1a1a;
    --drop-hover:#eef7ff;
  }
  /* MOD dark palette (matches WorkflowBuilder/dashboard .dark tokens). */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --primary:hsl(231 86% 66%); --accent:hsl(204 100% 65%);
      --bg:hsl(222 47% 11%); --card:hsl(217 33% 16%); --line:hsl(217 33% 24%);
      --muted:hsl(215 20% 65%); --fg:hsl(210 40% 98%); --drop-hover:hsl(217 33% 21%);
    }
  }
  /* Explicit override via ?theme=dark / ?theme=light, regardless of OS. */
  [data-theme="dark"] {
    --primary:hsl(231 86% 66%); --accent:hsl(204 100% 65%);
    --bg:hsl(222 47% 11%); --card:hsl(217 33% 16%); --line:hsl(217 33% 24%);
    --muted:hsl(215 20% 65%); --fg:hsl(210 40% 98%); --drop-hover:hsl(217 33% 21%);
  }
  * { box-sizing: border-box; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--fg); }
  .wrap { max-width:520px; margin:0 auto; padding:16px; }
  h1 { font-size:18px; margin:4px 0 12px; }
  .tabs { display:flex; gap:8px; margin-bottom:12px; }
  .tab { flex:1; padding:8px; border:1px solid var(--line); background:var(--card); color:var(--fg); border-radius:8px; cursor:pointer; font-size:14px; text-align:center; }
  .tab.active { border-color:var(--primary); color:var(--primary); font-weight:600; }
  .panel { display:none; } .panel.active { display:block; }
  .drop { border:2px dashed var(--line); border-radius:12px; padding:32px 16px; text-align:center; color:var(--muted); cursor:pointer; transition:.15s; background:var(--card); }
  .drop.hover { border-color:var(--accent); background:var(--drop-hover); color:var(--primary); }
  textarea { width:100%; min-height:120px; border:1px solid var(--line); border-radius:8px; padding:10px; font:inherit; background:var(--card); color:var(--fg); }
  .field { margin:10px 0; } .field label { display:block; font-size:13px; color:var(--muted); margin-bottom:4px; }
  .field input { width:100%; padding:8px; border:1px solid var(--line); border-radius:8px; font:inherit; background:var(--card); color:var(--fg); }
  button.run { width:100%; margin-top:16px; padding:13px; background:var(--primary); color:#fff; border:0; border-radius:8px; font-size:16px; font-weight:600; cursor:pointer; }
  button.run:disabled { opacity:.5; cursor:default; }
  .bar { height:8px; background:var(--line); border-radius:99px; overflow:hidden; margin-top:14px; display:none; }
  .bar > div { height:100%; width:30%; background:var(--accent); border-radius:99px; transition:width .4s; }
  .status { font-size:13px; color:var(--muted); margin-top:8px; text-align:center; }
  .result { margin-top:16px; }
  .result img, .result video { max-width:100%; border-radius:8px; border:1px solid var(--line); }
  .compare { display:flex; gap:12px; align-items:flex-start; }
  .compare figure { flex:1; margin:0; min-width:0; }
  .compare img { width:100%; display:block; }
  .compare figcaption { text-align:center; font-size:13px; font-weight:600; color:var(--muted); margin-top:6px; text-transform:uppercase; letter-spacing:.03em; }
  .dl { display:inline-block; margin-top:10px; padding:9px 16px; background:var(--accent); color:#fff; border-radius:8px; text-decoration:none; font-weight:600; font-size:14px; }
  .note { font-size:12px; color:var(--muted); margin-top:14px; text-align:center; }
  .blocked { text-align:center; padding:40px 16px; color:var(--muted); }
  .filechip { margin-top:10px; font-size:13px; color:var(--primary); }
</style>
</head>
<body>
<div class="wrap">
  <div id="app"><div class="status" style="margin-top:40px">Loading…</div></div>
</div>
<script src="/js/embed-run.js"></script>
</html>
