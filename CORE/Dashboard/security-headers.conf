# S19/CSP-1 phase 1: shared security-header snippet.
# nginx drops server-level add_header in any location block that defines its
# own add_header, so every location that sets Cache-Control must `include`
# this file to keep frame protection. The embed run page (/embed/run.html)
# deliberately does NOT include it: it is the embeddable share runner, and
# framing there is governed by the API's per-link frame-ancestors allowlist.
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-XSS-Protection "1; mode=block" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Content-Security-Policy "frame-ancestors 'self'" always;
