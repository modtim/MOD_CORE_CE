server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Emit relative redirects (Location: /path, no scheme/host) so a /docs/*
    # redirect stays on the caller's https scheme instead of bouncing through
    # http:// (this server listens on http behind the TLS-terminating proxy).
    absolute_redirect off;

    # The Dashboard's Mind Map tab (lives on a different subdomain
    # — dashboard.* vs docs.*) fetches this file cross-origin on
    # tab activation. Public, non-authenticated, no user data.
    # Allowing any origin keeps the per-tenant Dashboard origins
    # (and any custom CNAMEs) working without per-origin allowlist
    # maintenance.
    location = /help-tree.json {
        add_header Access-Control-Allow-Origin * always;
        add_header Cache-Control "public, max-age=300" always;
        default_type application/json;
        try_files $uri =404;
    }

    # RFC 9116 machine-readable security contact, published with the docs
    # site (static/.well-known/security.txt lands in the build output).
    # Served on the docs host; the Dashboard's copy proxies here.
    location = /.well-known/security.txt {
        add_header Cache-Control "public, max-age=300" always;
        default_type text/plain;
        try_files $uri =404;
    }

    # Docs are served at the site root (Docusaurus routeBasePath: '/'), so a
    # /docs/ prefix has no real route and the SPA fallback would render a
    # client-side "Page Not Found" (with a misleading HTTP 200). Redirect any
    # /docs/* (and bare /docs) to the real root path with a proper 301 so old
    # bookmarks and external links resolve instead of 404-ing.
    location = /docs { return 301 /; }
    location ~ ^/docs/(.*)$ { return 301 /$1; }

    # Everything else is the standard Docusaurus static-site
    # behaviour — try the requested path, fall back to index.html
    # so client-side routes resolve.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
