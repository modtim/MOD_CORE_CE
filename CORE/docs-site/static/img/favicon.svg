<?xml version="1.0" encoding="UTF-8"?>
<!--
  Favicon: MOD dotted-O on a brand-navy rounded tile. Explicit colors
  (navy #0333D0 tile + white dots) so it stays visible on both light and
  dark browser tabs — unlike the currentColor in-page logo, which renders
  black/invisible as a standalone favicon. Served by Next at /icon.svg.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <rect width="100" height="100" rx="22" fill="#0333D0"/>
  <g fill="#FFFFFF">
    <circle cx="50" cy="14" r="5.5"/>
    <circle cx="68" cy="19" r="5.5"/>
    <circle cx="81" cy="32" r="5.5"/>
    <circle cx="86" cy="50" r="5.5"/>
    <circle cx="81" cy="68" r="5.5"/>
    <circle cx="68" cy="81" r="5.5"/>
    <circle cx="50" cy="86" r="5.5"/>
    <circle cx="32" cy="81" r="5.5"/>
    <circle cx="19" cy="68" r="5.5"/>
    <circle cx="14" cy="50" r="5.5"/>
    <circle cx="19" cy="32" r="5.5"/>
    <circle cx="32" cy="19" r="5.5"/>
  </g>
</svg>
