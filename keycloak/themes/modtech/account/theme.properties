# Mod Tech Labs — Account Console theme.
# Extends Keycloak's v3 React account console with brand-aligned overrides.
parent=keycloak.v3

# Inject our brand CSS on top of PatternFly v5. The React app reads
# the styles list and emits matching <link> tags. Asset paths are
# resolved against this theme's `resources/` directory.
styles=style.css

# Brand the HTML <title> + meta description + masthead logo. Keys read by
# keycloak.v3/account/index.ftl — see `properties.X` references there.
title=My Account · Mod Tech Labs
description=Manage your Mod Tech Labs account, sign-in methods, and connected devices.
favIcon=/favicon.svg
favIconType=image/svg+xml
logo=/logo.svg
# Shipped installs pull only from GitHub/ghcr.io/Docker Hub; the masthead link stays same-origin.
logoUrl=/
