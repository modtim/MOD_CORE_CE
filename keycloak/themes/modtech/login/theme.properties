# ModTech Keycloak Theme
# Extends the default keycloak.v2 theme

parent=keycloak.v2
import=common/keycloak

styles=css/styles.css
# NOTE: do NOT add a hardcoded modApiBaseUrl here — this theme ships to every
# on-prem/CE install. login.ftl derives the API base from the Keycloak
# hostname (<prefix->keycloak.<base> -> <prefix->api.<base> + /v1), so it is
# correct on dev-, stage- and bare keycloak hosts, and skips the RUM beacon
# when the host has no "keycloak" in it. An explicit modApiBaseUrl property is
# still honored by login.ftl if a given install wants to override it.
